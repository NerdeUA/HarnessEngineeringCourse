apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: lab7
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      transform/redact_sensitive_genai_payload:
        error_mode: ignore
        trace_statements:
          - delete_key(span.attributes, "gcp.vertex.agent.llm_request")
          - delete_key(span.attributes, "gcp.vertex.agent.llm_response")
          - delete_key(span.attributes, "gcp.vertex.agent.tool_call_args")
          - delete_key(span.attributes, "gcp.vertex.agent.tool_response")
          - delete_matching_keys(span.attributes, "^gen_ai\\.(prompt|completion)(\\..*)?$")
          - delete_matching_keys(span.attributes, "^gen_ai\\.(input\\.messages|output\\.messages|tool\\.call\\.(arguments|result))$")
      batch: {}
    exporters:
      otlp_grpc/jaeger:
        endpoint: jaeger.lab7.svc.cluster.local:4317
        tls:
          insecure: true
      otlp_http/phoenix:
        traces_endpoint: http://phoenix-svc.phoenix.svc.cluster.local:6006/v1/traces
        headers:
          authorization: Bearer ${env:PHOENIX_API_KEY}
      otlp_http/mlflow:
        traces_endpoint: http://mlflow.lab7.svc.cluster.local:5000/v1/traces
        headers:
          x-mlflow-experiment-id: "0"
    service:
      extensions:
        - health_check
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - transform/redact_sensitive_genai_payload
            - batch
          exporters:
            - otlp_grpc/jaeger
            - otlp_http/phoenix
            - otlp_http/mlflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: lab7
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          env:
            - name: PHOENIX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phoenix-otel-exporter
                  key: api-key
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: lab7
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
